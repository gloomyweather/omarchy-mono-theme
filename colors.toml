# mono — grayscale desktop, real colors only where code lives (terminal, neovim).
# Neutrals and ANSI come from carbonfox; ANSI yellow is a true yellow
# (carbonfox's own "yellow" slot is teal).
mode = "dark"

accent = "#dfdfe0"
hyprland_active_border = "#b6b8bb"
