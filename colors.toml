darker_background = "#080808"
lighter_background = "#252525"

foreground = "#f2f4f8"
dark_foreground = "#535353"
light_foreground = "#b6b8bb"
bright_foreground = "#f9fbff"

red = "#ee5396"
yellow = "#f1c21b"
orange = "#ff832b"
green = "#25be6a"
cyan = "#33b1ff"
blue = "#78a9ff"
magenta = "#be95ff"
brown = "#8a5a2b"

bright_red = "#f16da6"
bright_yellow = "#fddc69"
